name: Validate and rebuild indexes

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate canonical records
        run: python scripts/validate.py
      - name: Run contract tests
        run: python -m unittest discover -s tests -v
      - name: Ensure indexes can be rebuilt
        run: python scripts/build_indexes.py

  rebuild-indexes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Rebuild generated indexes
        run: python scripts/build_indexes.py
      - name: Commit generated indexes when changed
        run: |
          if git diff --quiet -- indexes; then
            echo "Indexes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indexes
          git commit -m "chore: rebuild generated indexes"
          git push
