name: Protect Larry personal data

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  protect-personal-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Prevent external edits to Larry's personal memory
        uses: actions/github-script@v7
        with:
          script: |
            const trustedAssociations = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const association = context.payload.pull_request.author_association || "NONE";

            if (trustedAssociations.has(association)) {
              core.info("Trusted repository contributor (" + association + "); repository-wide changes are allowed.");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              }
            );

            const protectedPrefixes = [
              "data/",
              "media/",
              "self/",
              "derived/",
              "indexes/",
            ];

            const invalid = files
              .map(file => file.filename)
              .filter(path => protectedPrefixes.some(prefix => path.startsWith(prefix)));

            if (invalid.length > 0) {
              const lines = [
                "External contributors must not edit Larry's personal memory or generated views.",
                "Protected paths changed:",
              ];
              for (const path of invalid) {
                lines.push("- " + path);
              }
              lines.push("");
              lines.push("Fork the repository to keep your own food history. Code/docs/schema improvements are welcome here.");
              core.setFailed(lines.join("\n"));
              return;
            }

            core.info("No protected personal-memory paths were changed.");
